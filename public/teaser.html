<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>three people · three thousand</title>

<!--
  TEASER — "3 people, 3 thousand"

  Timeline (seconds from start):
    0.00  pure black (room tone lives in the edit, not here)
    0.90  bubble 1 fades in
    1.70  bubble 2 fades in
    2.50  bubble 3 fades in   <- VO enters here, in the edit
    9.00  HARD CUT to black, holds forever (music enters on the cut in the edit)

  Controls:
    click / space / enter   start (page is pure black until you do)
    R                       replay
  URL flags:
    ?auto=1                 start immediately on load
    ?loop=1                 replay ~1.2s after the cut
    ?t=3.2                  freeze on the frame at 3.2s (for stills / checking)
-->

<style>
  :root {
    --bg:     #000;
    --bubble: #26252b;
    --txt:    #f2f2f7;
    --font:   -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    user-select: none;
    -webkit-user-select: none;
  }

  body { cursor: none; }

  /* ── stage ───────────────────────────────────────────────── */
  #stage {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    /* hard cut is a property flip, never a transition */
    transition: none;
  }
  #stage.cut { opacity: 0; }

  /* ── thread ──────────────────────────────────────────────── */
  .thread {
    width: min(48rem, 86vw);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.46em;
    padding-left: 0.34em;          /* room for the tails */
    font-family: var(--font);
    font-size: clamp(20px, 2.25vw, 34px);
    font-weight: 400;
    line-height: 1.34;
  }

  /* ── bubble ──────────────────────────────────────────────── */
  .bubble {
    position: relative;
    max-width: 100%;
    padding: 0.53em 0.88em;
    border-radius: 1.14em;
    border-bottom-left-radius: 0;
    background: var(--bubble);
    color: var(--txt);
    letter-spacing: -0.004em;
    opacity: 0;
    transform: translateY(0.16em);
    will-change: opacity, transform;
  }

  /* fade in — transition lives on the "in" state so removals are instant */
  .bubble.in {
    opacity: 1;
    transform: none;
    transition:
      opacity 0.46s cubic-bezier(0.22, 0.61, 0.36, 1),
      transform 0.58s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  /* iMessage tail — one crooked curl off the bottom-left corner.
     Drawn as an inline SVG so the curve stays smooth at every size.
     update the fill (currently #26252b) if --bubble changes. */
  .bubble::before {
    content: "";
    position: absolute;
    left: -0.31em;
    bottom: 0;
    width: 0.31em;
    height: 0.72em;
    background: no-repeat 0 0 / 100% 100% url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 31 72'><path d='M31 18C31 45 16 61 1 72L31 72Z' fill='%2326252b'/></svg>");
  }

  /* ── hint (never on screen while recording if you don't touch the mouse) ── */
  #hint {
    position: fixed;
    left: 50%;
    bottom: 4.5vh;
    transform: translateX(-50%);
    font-family: var(--font);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #37373d;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  #hint.show { opacity: 1; }
</style>
</head>

<body>
  <main id="stage">
    <div class="thread">
      <div class="bubble">i did way more than 20%</div>
      <div class="bubble">can we just split it evenly</div>
      <div class="bubble">honestly idk what he did all week</div>
    </div>
  </main>

  <div id="hint">space to play &nbsp;·&nbsp; r to replay</div>

<script>
(() => {
  const stage   = document.getElementById('stage');
  const hint    = document.getElementById('hint');
  const bubbles = [...document.querySelectorAll('.bubble')];

  const TIMES = [0.90, 1.70, 2.50];   // bubble in-points, seconds
  const CUT   = 9.00;                 // hard cut to black

  const params = new URLSearchParams(location.search);
  const auto   = params.has('auto');
  const loop   = params.has('loop');
  const freeze = params.has('t') ? parseFloat(params.get('t')) : null;

  let raf = 0, t0 = 0, next = 0, cut = false, playing = false, restartTimer = 0;

  /* render a static frame — used by ?t= freeze mode */
  function renderAt(t) {
    bubbles.forEach((b, i) => b.classList.toggle('in', t >= TIMES[i]));
    stage.classList.toggle('cut', t >= CUT);
  }

  function tick(now) {
    const t = (now - t0) / 1000;

    while (next < bubbles.length && t >= TIMES[next]) {
      bubbles[next].classList.add('in');
      next++;
    }

    if (!cut && t >= CUT) {
      stage.classList.add('cut');   // single-frame hard cut
      cut = true;
      playing = false;
      if (loop) restartTimer = setTimeout(start, 1200);
      return;
    }

    raf = requestAnimationFrame(tick);
  }

  function start() {
    cancelAnimationFrame(raf);
    clearTimeout(restartTimer);
    hideHint();

    bubbles.forEach(b => b.classList.remove('in'));
    stage.classList.remove('cut');

    next = 0;
    cut = false;
    playing = true;
    t0 = performance.now();
    raf = requestAnimationFrame(tick);
  }

  /* ── hint ──────────────────────────────────────────────── */
  let idle = 0;
  function hideHint() { hint.classList.remove('show'); }
  function showHint() {
    hint.classList.add('show');
    clearTimeout(idle);
    idle = setTimeout(hideHint, 1800);
  }

  window.addEventListener('mousemove', () => { if (!freeze) showHint(); });
  window.addEventListener('blur', hideHint);

  /* ── input ─────────────────────────────────────────────── */
  window.addEventListener('pointerdown', () => { if (!playing) start(); });

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'enter') { e.preventDefault(); start(); }
    if (k === 'r') { e.preventDefault(); start(); }
  });

  /* ── boot ──────────────────────────────────────────────── */
  if (freeze !== null && !Number.isNaN(freeze)) {
    renderAt(freeze);
  } else {
    renderAt(-1);                       // pure black
    if (auto) start();
    else {
      hint.classList.add('show');       // brief, then gone
      idle = setTimeout(hideHint, 2600);
    }
  }

  // keep it black if the tab is backgrounded mid-run
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && playing) hideHint();
  });
})();
</script>
</body>
</html>
